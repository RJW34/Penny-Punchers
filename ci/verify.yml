name: Verify Penny Punchers
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Run on the configured Windows native verification PC
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  contracts-and-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.424
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python tools/validate_pack.py --strict-schema
      - run: dotnet run --project src/StrikeLedger.ContractTests -c ExportRelease -- --data data --self-test
      - run: dotnet run --project src/StrikeLedger.CoreTests -c ExportRelease -- --data data --self-test --evidence-dir reports/evidence/ci-core
      - run: dotnet run --project src/StrikeLedger.NetworkLab -c ExportRelease -- --data data --self-test --evidence-dir reports/evidence/ci-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: simulation-evidence
          path: reports/evidence/
  native-export-and-input:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    runs-on: [self-hosted, Windows, penny-punchers-native]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: pwsh
        run: |
          if ((& $env:GODOT_BIN --version) -notmatch '^4\.6\.3\.stable\.mono') { throw 'Godot 4.6.3 mono is required' }
          if ((& $env:DOTNET_BIN --version) -ne '8.0.424') { throw 'Pinned .NET SDK is required' }
          python tools/build.py --test --export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_native_evidence.py ui --label ci-audit-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_native_evidence.py windows-headless --label ci-audit-match
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-software-evidence
          path: reports/evidence/
